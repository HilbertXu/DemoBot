retargeting:
  type: POSITION
  robot_name: allegro
  urdf_path: /workspace/assets/robots/allegro_hand/allegro_hand_left_glb_base.urdf

  target_joint_names: null
  target_link_names: [ "link_15.0_tip", "link_11.0_tip", "link_7.0_tip", "link_3.0_tip", 
                       "link_14.0", "link_10.0", "link_6.0", "link_2.0", 
                       "link_13.0", "link_9.0", "link_5.0", "link_1.0" ]

  target_link_human_indices: [ 4, 8, 12, 16, 2, 6, 10, 14, 1, 5, 9, 13 ]
  add_dummy_free_joint: True

  # A smaller alpha means stronger filtering, i.e. more smooth but also larger latency
  # 1 means no filter while 0 means not moving
  low_pass_alpha: 0.99
